version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      go-dependencies:
        patterns: ["*"]
        exclude-patterns:
          - "github.com/laborin/vt10x"
          - "github.com/gdamore/tcell/*"
          - "github.com/rivo/tview"
    ignore:
      # Our fork, always bumped by hand
      - dependency-name: "github.com/laborin/vt10x"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
