name: Bug report
description: Something is broken or render wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open emed in ...
        2. Press ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Emed version
      description: Output of `emed --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Ubuntu 26.04 / macOS 26
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal emulator and $TERM
      placeholder: Blink on iPad, TERM=xterm-256color
    validations:
      required: true
  - type: dropdown
    id: ssh
    attributes:
      label: Connection
      options:
        - Local
        - SSH
        - SSH + tmux/screen
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots
      description: Screenshots help a lot for rendering bugs.
